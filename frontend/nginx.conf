server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers versionnés par Vite (nom avec empreinte) : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : toute URL inconnue renvoie index.html (le routeur React prend le relais).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le frontend est buildé avec VITE_API_BASE_URL=/api : le navigateur appelle
    # toujours la même origine que la page, et nginx renvoie la requête vers le
    # backend en interne (pas de CORS côté navigateur, backend non exposé).
    location /api/ {
        proxy_pass http://foulees12-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
